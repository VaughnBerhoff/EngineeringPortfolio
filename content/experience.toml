type = "text"
content="During my internship at Milwaukee Tool, I developed a proof-of-concept machine to improve the Big Hawg hole saw manufacturing process at the request of the NPD team. The primary challenge was reliably locating and orienting complex geometric components for assembly. I developed a custom pick-and-place system to automate this process, iterating through mechanism designs and testing to improve speed and repeatability. The final concept INCREASING MANUFACTURING THROUGHPUT BY 80% compared to manual assembly.\n\n I also adapted vibratory feeder-bowl technology for a new product assembly line, expanding my experience with high-volume part feeding, orientation, and manufacturing automation."


content="Working at Bikes Plus I gained skills as a mechanic learning the ins and outs of bike functionality. One of my favorite projects was frame swapping a Canyon Neuron CF8. Process: disassembled and stripped all components off the old frame including suspension, derailer, brakes, handlebars, and wheels. Cleaned and fixed old parts assembling them back onto the new frame. Truing the new bike to the customer's attributes."